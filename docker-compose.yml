services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
